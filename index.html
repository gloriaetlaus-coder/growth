<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <title>生长轨迹</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #203b31;
      --muted: #65786d;
      --paper: #edf3ec;
      --paper-deep: #dfe9e2;
      --surface: rgba(249, 251, 247, .74);
      --surface-solid: #f7faf5;
      --line: rgba(47, 86, 67, .15);
      --jade: #5f8c73;
      --jade-deep: #295b47;
      --moss: #7d9475;
      --gold: #b38a36;
      --gold-bright: #f4d98e;
      --gold-soft: rgba(190, 147, 59, .19);
      --shadow: rgba(35, 59, 47, .16);
      --mist: rgba(255, 255, 255, .78);
      --trunk: #6f5745;
      --trunk-light: #9a795a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e2ede5;
        --muted: #9eb2a5;
        --paper: #0d1814;
        --paper-deep: #12241c;
        --surface: rgba(18, 36, 28, .78);
        --surface-solid: #14281f;
        --line: rgba(208, 231, 216, .12);
        --jade: #86b69a;
        --jade-deep: #b5d8c3;
        --moss: #769a7f;
        --gold: #d7b560;
        --gold-bright: #fff0b7;
        --gold-soft: rgba(217, 180, 93, .14);
        --shadow: rgba(0, 0, 0, .3);
        --mist: rgba(197, 222, 207, .1);
        --trunk: #8c7057;
        --trunk-light: #b79775;
      }
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 8%, rgba(152, 188, 165, .25), transparent 34%),
        radial-gradient(circle at 86% 30%, rgba(214, 194, 130, .14), transparent 30%),
        linear-gradient(160deg, var(--paper), var(--paper-deep));
      font-family: "Noto Serif SC", "Songti SC", serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      padding: max(22px, env(safe-area-inset-top)) 22px max(34px, env(safe-area-inset-bottom));
    }
    .app::before,
    .app::after {
      content: "";
      position: fixed;
      z-index: -1;
      pointer-events: none;
      width: 72vw;
      height: 28vh;
      border-radius: 50%;
      filter: blur(34px);
      background: var(--mist);
      opacity: .72;
      animation: drift 17s ease-in-out infinite alternate;
    }
    .app::before { left: -18vw; top: 17vh; }
    .app::after { right: -26vw; bottom: 3vh; animation-duration: 23s; animation-direction: alternate-reverse; }
    @keyframes drift {
      from { transform: translate3d(-3vw, -1vh, 0) scale(.9); }
      to { transform: translate3d(17vw, 5vh, 0) scale(1.15); }
    }
    .frame { width: min(1120px, 100%); margin: 0 auto; }
    .topline {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      padding: 4px 2px 18px;
    }
    .season {
      color: var(--muted);
      font-family: "LXGW WenKai TC", cursive;
      font-size: 14px;
      letter-spacing: .12em;
    }
    .tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--surface-solid) 74%, transparent);
      box-shadow: 0 8px 28px rgba(25, 54, 39, .08);
    }
    .tab {
      width: 42px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 999px;
      padding: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color .25s ease, background .25s ease, box-shadow .25s ease;
    }
    .tab svg { width: 20px; height: 20px; }
    .tab[aria-selected="true"] {
      color: #f5faf6;
      background: var(--jade-deep);
      box-shadow: 0 5px 16px rgba(38, 84, 64, .24);
    }
    .view { display: none; min-height: calc(100vh - 90px); }
    .view.active { display: block; }

    /* tree view */
    .tree-layout {
      min-height: calc(100vh - 92px);
      display: grid;
      place-items: center;
      padding: 10px 0 28px;
    }
    .tree-stage {
      width: 100%;
      height: min(84vh, 820px);
      min-height: 560px;
      display: grid;
      place-items: center;
    }
    .tree-art {
      width: min(96vw, 760px);
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 28px 30px var(--shadow));
    }
    .canopy {
      transform-box: fill-box;
      transform-origin: 50% 88%;
      animation: canopy-breathe 8s ease-in-out infinite alternate;
    }
    .canopy-back { fill: #315f45; }
    .canopy-mid { fill: #4f7d59; }
    .canopy-light { fill: #6f9867; }
    .canopy-shadow { fill: #244d38; opacity: .74; }
    .leaf-detail { fill: #88aa76; opacity: .92; }
    .leaf-detail.dark { fill: #2f6446; }
    .trunk-main { fill: url(#trunkGradient); }
    .branch-fill { fill: none; stroke: #604b38; stroke-linecap: round; stroke-linejoin: round; }
    .bark-line { fill: none; stroke: #b18a62; stroke-linecap: round; opacity: .62; }
    .root-shadow { fill: rgba(31, 60, 45, .14); }
    @keyframes canopy-breathe {
      from { transform: rotate(-.35deg); }
      to { transform: rotate(.5deg); }
    }
    @media (prefers-color-scheme: dark) {
      .canopy-back { fill: #274c39; }
      .canopy-mid { fill: #3f6c4f; }
      .canopy-light { fill: #60835e; }
      .canopy-shadow { fill: #193a2b; }
      .leaf-detail { fill: #7c9c70; }
      .leaf-detail.dark { fill: #28563d; }
      .root-shadow { fill: rgba(0, 0, 0, .3); }
    }

    /* timeline view */
    .timeline-shell { max-width: 820px; margin: 0 auto; padding: 44px 0 70px; }
    .timeline-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 44px; }
    h2 {
      margin: 0;
      font-family: "LXGW WenKai TC", "STKaiti", cursive;
      font-size: clamp(34px, 5vw, 56px);
      font-weight: 400;
      line-height: 1.2;
    }
    .timeline-head p { margin: 0 0 7px; color: var(--muted); line-height: 1.7; text-align: right; }
    .timeline { position: relative; padding-left: 48px; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: linear-gradient(to bottom, rgba(179,138,54,.1), var(--gold) 12%, var(--gold) 88%, rgba(179,138,54,.1));
      box-shadow: 0 0 12px rgba(217, 181, 94, .52);
    }
    .shine {
      position: absolute;
      z-index: 2;
      left: 9px;
      top: 0;
      width: 10px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,248,198,.95), rgba(255,226,126,.5) 38%, transparent 72%);
      filter: blur(1px);
      animation: flow 4.8s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes flow { from { transform: translateY(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } to { transform: translateY(430px); opacity: 0; } }
    .entry { position: relative; padding: 0 0 38px 22px; }
    .entry:last-child { padding-bottom: 0; }
    .entry::before {
      content: "";
      position: absolute;
      left: -41px;
      top: 9px;
      width: 13px;
      height: 13px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      background: var(--surface-solid);
      box-shadow: 0 0 0 5px var(--gold-soft), 0 0 16px rgba(222, 186, 92, .42);
    }
    .date { color: var(--gold); font-size: 14px; font-weight: 600; letter-spacing: .1em; }
    .memory-card {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 24px 8px 24px 8px;
      background: var(--surface);
      box-shadow: 0 16px 42px rgba(38, 64, 50, .1);
      padding: 22px 24px;
    }
    .memory-card h3 { margin: 0; font-size: 21px; font-weight: 500; }
    .memory-card p { margin: 10px 0 0; color: var(--muted); line-height: 1.8; }
    .photo-preview { margin-top: 16px; }
    .photo-preview img {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 16px 5px 16px 5px;
    }
    .entry-actions { display: flex; align-items: center; gap: 12px; margin-top: 17px; }
    .photo-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 999px;
      padding: 8px 13px;
      background: var(--gold-soft);
      color: var(--gold);
      cursor: pointer;
    }
    .photo-label svg { width: 16px; height: 16px; }
    .session-note { color: var(--muted); font-size: 12px; }
    .file-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .remove-photo { border: 0; background: transparent; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 5px; }
    .hidden { display: none !important; }
    .end-mark { margin: 32px 0 0 61px; color: var(--muted); font-family: "LXGW WenKai TC", cursive; font-size: 13px; letter-spacing: .12em; }

    @media (max-width: 760px) {
      .app { padding-inline: 16px; }
      .topline { position: sticky; top: 0; z-index: 20; padding: 8px 0 12px; background: linear-gradient(var(--paper), color-mix(in srgb, var(--paper) 86%, transparent), transparent); }
      .season { display: none; }
      .tabs { width: auto; margin-left: auto; }
      .tab { flex: none; min-width: 42px; }
      .tree-layout { min-height: calc(100vh - 80px); padding: 0; }
      .tree-stage { min-height: 500px; height: calc(100vh - 88px); }
      .tree-art { width: min(116vw, 650px); }
      .timeline-shell { padding-top: 24px; }
      .timeline-head { display: block; margin-bottom: 34px; }
      .timeline-head p { text-align: left; margin-top: 12px; }
      .timeline { padding-left: 32px; }
      .timeline::before { left: 8px; }
      .shine { left: 4px; }
      .entry { padding-left: 14px; }
      .entry::before { left: -31px; }
      .memory-card { padding: 19px 18px; border-radius: 20px 7px 20px 7px; }
      .entry-actions { align-items: flex-start; flex-direction: column; }
      .end-mark { margin-left: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <script>
    (function () {
      var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
      var views = Array.prototype.slice.call(document.querySelectorAll('.view'));

      function showView(name) {
        tabs.forEach(function (tab) {
          var on = tab.id === 'tab-' + name;
          tab.setAttribute('aria-selected', on ? 'true' : 'false');
          tab.tabIndex = on ? 0 : -1;
        });
        views.forEach(function (view) {
          var on = view.id === name + '-view';
          view.classList.toggle('active', on);
          view.hidden = !on;
        });
        window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      }

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () { showView(tab.id.replace('tab-', '')); });
        tab.addEventListener('keydown', function (event) {
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          event.preventDefault();
          var next = tab.id === 'tab-tree' ? document.getElementById('tab-timeline') : document.getElementById('tab-tree');
          next.click();
          next.focus();
        });
      });

      document.querySelectorAll('.year-link').forEach(function (button) {
        button.addEventListener('click', function () {
          showView('timeline');
          var target = document.querySelector('.entry[data-year="' + button.getAttribute('data-jump') + '"]');
          if (target) setTimeout(function () { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 80);
        });
      });

      document.querySelectorAll('.entry').forEach(function (entry) {
        var input = entry.querySelector('.file-input');
        var preview = entry.querySelector('.photo-preview');
        var remove = entry.querySelector('.remove-photo');
        var note = entry.querySelector('.session-note');
        var currentUrl = null;

        input.addEventListener('change', function () {
          var file = input.files && input.files[0];
          if (!file) return;
          if (currentUrl) URL.revokeObjectURL(currentUrl);
          currentUrl = URL.createObjectURL(file);
          var image = document.createElement('img');
          image.src = currentUrl;
          image.alt = '为这段成长记忆选择的照片';
          preview.replaceChildren(image);
          remove.classList.remove('hidden');
          note.textContent = '已贴好 · 仅本次预览';
        });

        remove.addEventListener('click', function () {
          if (currentUrl) URL.revokeObjectURL(currentUrl);
          currentUrl = null;
          input.value = '';
          preview.replaceChildren();
          remove.classList.add('hidden');
          note.textContent = '照片仅在本次预览中显示';
        });
      });
    })();
  </script>
</body>
</html>
